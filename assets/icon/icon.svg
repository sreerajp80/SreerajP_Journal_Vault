<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="SreerajP Journal Vault icon">
  <title>SreerajP Journal Vault</title>
  <desc>Locked indigo journal with a gold keyhole escutcheon. Master design reference; raster icons are produced by tools/gen_app_icon.py.</desc>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#2A2666"/>
      <stop offset="100%" stop-color="#0C0A26"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%"  stop-color="#4840AF" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#4840AF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#423C9B"/>
      <stop offset="100%" stop-color="#161341"/>
    </linearGradient>
    <linearGradient id="spine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#0C0A26"/>
      <stop offset="100%" stop-color="#161341"/>
    </linearGradient>
    <linearGradient id="pages" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#E8D7AF"/>
      <stop offset="100%" stop-color="#B4A073"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FADE8A"/>
      <stop offset="100%" stop-color="#9B761C"/>
    </linearGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#5F460E"/>
    </linearGradient>
    <linearGradient id="inset" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#0C0A26"/>
      <stop offset="100%" stop-color="#161341"/>
    </linearGradient>
    <filter id="bookShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <radialGradient id="barrelHi" cx="35%" cy="30%" r="55%">
      <stop offset="0%"  stop-color="#FFF5D2" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFF5D2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#bgGlow)"/>

  <!-- Book group: width 594, height 778, centered -->
  <g transform="translate(215 123)">
    <!-- Drop shadow -->
    <rect x="14" y="22" width="594" height="778" rx="42" ry="42" fill="#000" opacity="0.5" filter="url(#bookShadow)"/>

    <!-- Cover -->
    <rect width="594" height="778" rx="42" ry="42" fill="url(#cover)"/>

    <!-- Spine band on left -->
    <clipPath id="coverClip">
      <rect width="594" height="778" rx="42" ry="42"/>
    </clipPath>
    <g clip-path="url(#coverClip)">
      <rect x="0" y="0" width="27" height="778" fill="url(#spine)"/>
      <!-- Page block on right -->
      <rect x="571" y="0" width="23" height="778" fill="url(#pages)"/>
      <!-- Page striations -->
      <g stroke="#9B8250" stroke-width="1" opacity="0.35">
        <line x1="572" y1="50"  x2="592" y2="50"/>
        <line x1="572" y1="80"  x2="592" y2="80"/>
        <line x1="572" y1="110" x2="592" y2="110"/>
        <line x1="572" y1="140" x2="592" y2="140"/>
        <line x1="572" y1="170" x2="592" y2="170"/>
        <line x1="572" y1="200" x2="592" y2="200"/>
        <line x1="572" y1="230" x2="592" y2="230"/>
        <line x1="572" y1="260" x2="592" y2="260"/>
        <line x1="572" y1="290" x2="592" y2="290"/>
        <line x1="572" y1="320" x2="592" y2="320"/>
        <line x1="572" y1="350" x2="592" y2="350"/>
        <line x1="572" y1="380" x2="592" y2="380"/>
        <line x1="572" y1="410" x2="592" y2="410"/>
        <line x1="572" y1="440" x2="592" y2="440"/>
        <line x1="572" y1="470" x2="592" y2="470"/>
        <line x1="572" y1="500" x2="592" y2="500"/>
        <line x1="572" y1="530" x2="592" y2="530"/>
        <line x1="572" y1="560" x2="592" y2="560"/>
        <line x1="572" y1="590" x2="592" y2="590"/>
        <line x1="572" y1="620" x2="592" y2="620"/>
        <line x1="572" y1="650" x2="592" y2="650"/>
        <line x1="572" y1="680" x2="592" y2="680"/>
        <line x1="572" y1="710" x2="592" y2="710"/>
      </g>
    </g>

    <!-- Decorative gold border -->
    <rect x="50" y="47" width="494" height="684" rx="29" ry="29"
          fill="none" stroke="url(#goldRim)" stroke-width="5" opacity="0.92"/>

    <!-- Top + bottom rules -->
    <line x1="143" y1="140" x2="451" y2="140" stroke="#D4AF37" stroke-width="3" opacity="0.85"/>
    <line x1="143" y1="638" x2="451" y2="638" stroke="#D4AF37" stroke-width="3" opacity="0.85"/>

    <!-- Corner diamonds -->
    <g fill="#D4AF37" opacity="0.92">
      <polygon points="76,52  88,64  76,76  64,64"/>
      <polygon points="518,52 530,64 518,76 506,64"/>
      <polygon points="76,702 88,714 76,726 64,714"/>
      <polygon points="518,702 530,714 518,726 506,714"/>
    </g>

    <!-- Keyhole escutcheon (gold pill) -->
    <g transform="translate(297 389)">
      <rect x="-101" y="-163" width="202" height="326" rx="101" ry="101" fill="url(#gold)"/>
      <!-- thin darker rim -->
      <rect x="-93" y="-155" width="186" height="310" rx="93" ry="93"
            fill="none" stroke="#5F460E" stroke-width="2.5" opacity="0.55"/>
      <!-- recessed dark inset -->
      <rect x="-79" y="-137" width="158" height="274" rx="79" ry="79" fill="url(#inset)"/>

      <!-- Keyhole barrel -->
      <circle cx="0" cy="-46" r="63" fill="#FADE8A"/>
      <!-- Specular highlight -->
      <circle cx="-22" cy="-66" r="22" fill="url(#barrelHi)"/>
      <!-- Tapered slot -->
      <path d="M -37 14 L -73 147 L 73 147 L 37 14 Z" fill="#FADE8A"/>
      <ellipse cx="0" cy="147" rx="73" ry="14" fill="#FADE8A"/>
    </g>
  </g>
</svg>

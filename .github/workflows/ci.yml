# CI for SreerajP Journal Vault.
#
# Covers the minimum checks from the engineering standard section 19.1, plus the
# dev debug build from section 19.2.
#
# The signed prod release build from 19.2 is NOT here yet: the release keystore
# does not exist, so the build would fall back to the debug key and produce an
# artifact that must never be distributed. See docs/architecture.md section 21
# and docs/release_process.md section 0. Add the release job once the keystore
# exists and its passwords are stored as repository secrets.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.8
  JAVA_VERSION: '17'

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # docs/guidelines is a submodule; without it the doc links break.
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate localizations
        run: flutter gen-l10n

      # Named folders, not ".". Plain `dart format .` crashes on stale paths
      # under build/.
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: warn

  privacy-check:
    name: No absolute paths in docs, plans or change logs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The same check the pre-commit hook runs. It exists because plans/,
      # change_log/ and docs/ may become public and must not leak the layout of
      # a developer's machine. See docs/workflow_rules.md section 4.
      - name: Check for absolute local paths
        run: sh tool/check_absolute_paths.sh --all

  permission-guard-check:
    name: Guard offline and unused permissions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check manifest permission removals
        run: sh tool/check_no_internet_permission.sh

  build-dev:
    name: Build dev debug APK
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      # This app defines flavors, so a bare `flutter build apk` fails.
      - name: Build dev debug APK
        run: flutter build apk --flavor dev --debug
